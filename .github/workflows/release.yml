name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Wails 3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      - name: Build
        run: |
          task darwin:package:universal
          cd bin && zip -r "MyTools-macOS-universal.zip" "wails-mytools.app"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-darwin
          path: bin/MyTools-macOS-universal.zip

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Wails 3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Task
        run: |
          $url = "https://github.com/go-task/task/releases/latest/download/task_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile task.zip
          Expand-Archive task.zip -DestinationPath C:\task-bin
          Add-Content $env:GITHUB_PATH "C:\task-bin"
        shell: pwsh

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      - name: Build
        run: |
          task windows:build
          Compress-Archive -Path "bin/wails-mytools.exe" -DestinationPath "bin/MyTools-Windows-amd64.zip"
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: bin/MyTools-Windows-amd64.zip

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Linux dependencies
        run: |
          echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list.d/jammy-extra.list
          echo "deb http://archive.ubuntu.com/ubuntu jammy-security main universe" | sudo tee -a /etc/apt/sources.list.d/jammy-extra.list
          echo "deb http://archive.ubuntu.com/ubuntu jammy-updates main universe" | sudo tee -a /etc/apt/sources.list.d/jammy-extra.list
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
          pkg-config --modversion gtk4 webkitgtk-6.0

      - name: Install Wails 3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      - name: Build
        run: |
          task linux:build
          tar -czf bin/MyTools-Linux-amd64.tar.gz -C bin wails-mytools

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: bin/MyTools-Linux-amd64.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    if: success()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' frontend/package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-*

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MyTools ${{ steps.version.outputs.tag }}
          draft: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
